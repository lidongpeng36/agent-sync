[package]
name = "agent-sync"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Safely synchronize coding-agent sessions and memories over SSH"
license = "MIT"
repository = "https://github.com/lidongpeng36/agent-sync"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
filetime = "0.2"
flate2 = "1.1"
hex = "0.4"
regex = "1.11"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tar = "0.4"
tempfile = "3.20"
toml = "0.9"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v5"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
